name: tallyowl-helm-check
description: "Run the TallyOwl helm-check job through the runnerlib lifecycle."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  priority: 10
  working_dir: /job
environment:
  REACTORCIDE_TALLYOWL_JOB: helm-check
run_local:
  user: host
