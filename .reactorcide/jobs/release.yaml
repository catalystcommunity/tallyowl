name: tallyowl-release
description: "Cut the next version from the conventional commits, build the artifacts, and publish them."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  # The image compiles the Rust workspace from source, which is the longest
  # step here by a wide margin.
  timeout: 7200
  priority: 20
  working_dir: /job
  capabilities:
    # A daemon to build the service image against. The push needs none: crane
    # sends the archive the package step saved.
    - docker
  # This job compiles the Rust workspace inside the image build, which is where
  # almost all of its ten minutes go. `cargo` uses every core it is given. The
  # request stays at 4 because that is the figure this cluster schedules
  # reliably for linkkeys; the limit is what the compile actually takes when
  # the node has it spare.
  resources:
    cpu:
      request: "4"
      limit: "8"
    memory:
      limit: "12Gi"
  # A secret-bearing job must not run on a developer machine, where a secret
  # reference would resolve against whatever is lying around.
  disable_run_local: true
environment:
  REACTORCIDE_TALLYOWL_JOB: release
  # D31, decided 2026-08-12. The image goes to the registry every other
  # service here uses, on the grant that already exists. The charts go into the
  # charts repository that serves them. The browser package goes to npmjs with
  # `npm publish`; whether it is live at once or waits for a person is decided
  # by the token and the organisation's 2FA setting, because npm publishes no
  # CLI for staging and offers OIDC to three CI providers, none of them this
  # one (L190). The Rust driver waits on the crates.io dependency clearance and
  # this job publishes none of it.
  REGISTRY: "containers.catalystsquad.com"
  IMAGE_PATH: "public/catalystcommunity/tallyowl"
  CHARTS_REPO: "catalystcommunity/charts"
  REGISTRY_USER: "${secret:catalystcommunity/registry:user}"
  REGISTRY_PASSWORD: "${secret:catalystcommunity/registry:password}"
  GITHUB_PAT: "${secret:catalystcommunity/ci:githubpat}"
  NPM_TOKEN: "${secret:catalystcommunity/ci:npmpublish}"
