name: tallyowl-test-rust
description: "Run the TallyOwl test-rust job through the runnerlib lifecycle."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  priority: 10
  working_dir: /job
  # About 1,200 tests from an empty target directory. The compile is the bulk
  # of it and `cargo` scales with the cores it is given.
  resources:
    cpu:
      request: "4"
      limit: "8"
    memory:
      limit: "12Gi"
environment:
  REACTORCIDE_TALLYOWL_JOB: test-rust
run_local:
  user: host
