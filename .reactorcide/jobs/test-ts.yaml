name: tallyowl-test-ts
description: "Run the TallyOwl test-ts job through the runnerlib lifecycle."
job:
  image: containers.catalystsquad.com/public/reactorcide/runnerbase:latest
  command: "runnerlib run --job-command true"
  timeout: 3600
  priority: 10
  working_dir: /job
  resources:
    cpu:
      request: "1"
      limit: "4"
    memory:
      limit: "6Gi"
environment:
  REACTORCIDE_TALLYOWL_JOB: test-ts
run_local:
  user: host
