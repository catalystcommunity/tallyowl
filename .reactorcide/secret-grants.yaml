# Desired secret grants for the TallyOwl project.
#
# **One job holds every grant, and it is the only job that publishes.** Every
# other job in every workflow — the gates, the packaging — runs with no grant
# at all, which is what makes a pull request from a fork safe to run.
#
# Review the live grants and use a dry run before you apply this file. The file
# does not prune, because an apply must not remove an unrecorded production
# grant.
#
# The grant subject is the **workflow node name**, and every node here is named
# for its job so the two cannot disagree. See docs/CI-CD.md section 6.
apiVersion: reactorcide.catalystcommunity.io/v1alpha1
kind: SecretGrantList
items:
  - metadata:
      name: tallyowl-release-registry
    spec:
      scope:
        project: github.com/catalystcommunity/tallyowl
      secret:
        path: catalystcommunity/registry
        match: exact
      subject:
        jobName:
          value: tallyowl-release
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Push the service image to containers.catalystsquad.com."

  - metadata:
      name: tallyowl-release-ci
    spec:
      scope:
        project: github.com/catalystcommunity/tallyowl
      secret:
        path: catalystcommunity/ci
        match: exact
      subject:
        jobName:
          value: tallyowl-release
          match: exact
      executionProfiles: [standard]
      ciOrigins: [base]
      description: "Tag the release, publish the GitHub Release, add the charts, and stage the npm package."
