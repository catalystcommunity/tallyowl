{{/*
Gateway API routes for the surfaces that speak HTTP.

**The ingest path is not here, and that is deliberate.** Native TallyOwl
traffic is CSIL over TLS over TCP, and an application reaches the collector
directly; an HTTPRoute in front of it would be a generic HTTP ingest API, which
AGENTS.md forbids. What an HTTPRoute can carry is the dashboard, which is a
browser surface, and the operational endpoint, which an operator publishes only
on purpose.

A Gateway is not created here. It is cluster infrastructure with a listener and
an address that belong to the platform, and a chart that created one would be
claiming both.
*/}}
{{- if .Values.gateway.enabled }}
{{- if not .Values.gateway.parentRef.name }}
{{- fail "`gateway.enabled` is on and `gateway.parentRef.name` is empty. An HTTPRoute attaches to a Gateway, and this chart does not create one." }}
{{- end }}
{{- if .Values.gateway.dashboard.enabled }}
{{- fail "`gateway.dashboard.enabled` is on in the collector chart. A collector serves no dashboard; the head chart does." }}
{{- end }}
{{- if .Values.gateway.dashboard.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tallyowl-collector.fullname" . }}-dashboard
  labels:
    {{- include "tallyowl-collector.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.dashboard.path | quote }}
      backendRefs:
        - name: {{ include "tallyowl-collector.fullname" . }}
          port: {{ include "tallyowl-collector.port" .Values.dashboard.listen }}
{{- end }}
{{- if .Values.gateway.operational.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tallyowl-collector.fullname" . }}-operational
  labels:
    {{- include "tallyowl-collector.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.parentRef.name }}
      {{- with .Values.gateway.parentRef.namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .Values.gateway.parentRef.sectionName }}
      sectionName: {{ . }}
      {{- end }}
  {{- with .Values.gateway.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.operational.path | quote }}
      backendRefs:
        - name: {{ include "tallyowl-collector.fullname" . }}
          port: {{ include "tallyowl-collector.port" .Values.collector.operationalListen }}
{{- end }}
{{- end }}
