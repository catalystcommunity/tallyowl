# Values for the TallyOwl collector chart.
#
# The settings tree below is the same tree as `tallyowl.example.yaml` and the
# same tree the configuration loader reads. A test renders this chart and
# asserts that the chart and the loader agree on every key, every type, and
# every required value. A setting added to only one of them fails that test.
# See docs/DEPLOYMENT.md section 8 and docs/PLAN.md Phase 1.
#
# Keys under `image`, `replicas`, `resources`, `persistence`, `topologySpread`,
# `disruption`, `autoscaling`, and `deployment` are deployment concerns rather
# than TallyOwl settings, and the parity test ignores them.

# The head and the collector are one image, and each chart selects its binary
# with `command`. An empty tag means the chart's `appVersion`, which is the
# version the whole tree carries. See docs/CI-CD.md section 6.
image:
  repository: containers.catalystsquad.com/public/catalystcommunity/tallyowl
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1

# A CPU request is what `autoscaling` measures utilization against. With no
# request the autoscaler reports "missing request for cpu" and never scales, so
# the chart refuses autoscaling without one.
#
# A collector holds one batch for each request in flight and keeps no data. The
# memory limit covers 8 requests in flight on many connections at the 512 KiB
# batch limit, the metric series ledger at its default budget, and headroom.
# There is no CPU limit: a throttled collector acknowledges late, and its
# applications then hold more unacknowledged data.
resources:
  requests:
    cpu: 500m
    memory: 256Mi
  limits:
    memory: 1Gi

# The image runs as user and group 65532 and cannot write as root. A collector
# holds no durable state and mounts no data volume. `fsGroup` gives the group
# of the process read access to the certificate and key files of
# `deployment.tls`, which are mounted with mode 0440.
securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# ---------------------------------------------------------------------------
# Placement and disruption
#
# All collectors on one node means one drain stops all intake. The spread is
# `ScheduleAnyway`: a collector that cannot spread is better than no collector.
# The disruption budget applies when there is more than one replica.
# ---------------------------------------------------------------------------
topologySpread:
  enabled: true
  constraints:
    - topologyKey: kubernetes.io/hostname
      maxSkew: 1
      whenUnsatisfiable: ScheduleAnyway

disruption:
  enabled: true
  maxUnavailable: 1

# ---------------------------------------------------------------------------
# The pod
#
# Everything here is a deployment concern. None of it reaches the settings
# ConfigMap.
# ---------------------------------------------------------------------------
deployment:
  podAnnotations: {}

  # How long the kubelet waits after SIGTERM before it sends SIGKILL. A
  # collector that handles SIGTERM stops intake and finishes or releases its
  # claimed tasks in this time.
  terminationGracePeriodSeconds: 60

  # The restrictions of the Pod Security `restricted` profile. A collector
  # writes no file, so the root file system is read-only.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  startupProbe:
    periodSeconds: 5
    failureThreshold: 24

  # The key the compatibility receivers and self-observation present. Make it
  # with the head chart's maintenance Job, store it in a Secret, and name the
  # Secret here. The chart sets `collector.apiKey` to `env:SECRET_TALLYOWL_API_KEY`
  # and fills that variable from the Secret. The value never appears in a
  # manifest. A native application presents its own key and does not need this.
  apiKeySecret:
    name: ""
    key: api-key

  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

  # Transport security (D62). In a pod, `collector.listen` and the
  # OpenTelemetry receiver are reached over the pod network, so they use TLS,
  # and the collector reaches the head over mutual TLS. The chart refuses a
  # render with neither these Secrets nor `transport.allowPlaintext`.
  # docs/DEPLOYMENT.md section 7c gives the whole procedure.
  tls:
    # Secrets of type `kubernetes.io/tls` (`tls.crt`, the chain with the leaf
    # first, and `tls.key`) that applications verify the collector against.
    # Name two while a certificate is replaced: the collector presents the one
    # that is valid now and started last. The chart sets
    # `tls.certificateDirectories`.
    certificateSecrets: []
    # The authorities the collector verifies the head against, one Secret each.
    # `key` is the file in the Secret, `ca.crt` when it is empty. The chart
    # adds each to `installation.authorities`.
    authorities: []
    #   - secretName: tallyowl-authority
    #     key: ca.crt
    # The role token this collector enrolls with at each start. The chart sets
    # `enrollment.roleToken` to `env:SECRET_TALLYOWL_ROLE_TOKEN` and fills that
    # variable from the Secret. The value never appears in a manifest.
    roleTokenSecret:
      name: ""
      key: token

  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}

  # The OpenTelemetry listener has no authentication, and intake carries no
  # transport security in this release. This policy limits both. It is off by
  # default because a cluster with no policy controller ignores it, and that
  # must not look like protection.
  networkPolicy:
    enabled: false
    # `from` entries for intake and for the OpenTelemetry port. Empty means
    # every pod in the namespace.
    ingressFrom: []

# A collector holds no durable state. Corndogs owns the queue and the payload,
# so a collector stays a stateless Deployment and needs no volume.
persistence:
  enabled: false

# ---------------------------------------------------------------------------
# Autoscaling
#
# A collector is stateless, so it scales horizontally on load. Every replica
# must reach the same Corndogs service, which is where the durable queue lives.
# ---------------------------------------------------------------------------
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCpuPercent: 75

# ---------------------------------------------------------------------------
# What the pod binds, and where the dashboard bundle is
#
# These are deployment concerns, not TallyOwl settings, and the parity test
# ignores them along with `image` and `replicas`.
#
# **The settings tree below keeps the loader's own defaults**, which are
# loopback: a process on a workstation must not open a port to the network
# because somebody started it. A pod is the other case — a loopback bind there
# reaches nothing, and the Service in front of it forwards to a port no client
# can use — so the rendered configuration replaces the host part of every
# listening address with this one. The port always comes from the setting.
#
# Set this to 127.0.0.1 for a pod whose only client is a sidecar.
bindAddress: 0.0.0.0

# Where the dashboard bundle is in the container image. The head serves
# `/assets/<path>` from inside this directory. The setting below keeps the
# loader default, which is the path a developer builds into.
dashboardAssets: /usr/local/share/tallyowl/dashboard

# ---------------------------------------------------------------------------
# Gateway API
#
# How traffic from outside the cluster reaches this installation. An HTTPRoute
# attaches to a Gateway somebody else owns: a Gateway is cluster
# infrastructure, and a chart that created one would be claiming a listener and
# an address that belong to the platform.
#
# **This is off by default**, like every other port TallyOwl can open. An
# operator turns it on and names the Gateway.
#
# There is no Ingress template. Gateway API is the interface this chart
# supports; Ingress can be added if somebody needs it.
# ---------------------------------------------------------------------------
gateway:
  enabled: false
  # The Gateway to attach to. `namespace` may be empty for a Gateway in this
  # release's own namespace.
  parentRef:
    name: ""
    namespace: ""
    sectionName: ""
  # The names this installation answers to. An empty list attaches to every
  # hostname the Gateway listener accepts, which is rarely what anybody wants.
  hostnames: []
  # Which surfaces get a route. The dashboard is a browser surface and is the
  # one an operator usually publishes. Ingest is a native CSIL over TLS over
  # TCP path and is **not** HTTP, so it gets no HTTPRoute: an application
  # reaches the collector directly. See AGENTS.md, "Protocol boundaries".
  dashboard:
    enabled: false
    path: /
  # The operational surface: health and metrics, and nothing else. Publishing
  # it outside the cluster is a decision rather than a default.
  operational:
    enabled: false
    path: /metrics
  annotations: {}

# ---------------------------------------------------------------------------
# TallyOwl settings
# ---------------------------------------------------------------------------
installation:
  id: local
  # `home` is one head, one collector, and one Corndogs. It is the smallest
  # supported production deployment, which is why the development loop uses it.
  profile: home
  # The authorities this process trusts for a connection between TallyOwl
  # services, as PEM files. List two to replace an authority with no outage.
  # A process whose every connection is on loopback or a unix socket needs none.
  # `tallyowl-head ca create <directory>` makes a root and an intermediate.
  authorities: []
  # A head that signs node certificates: the intermediate authority's PEM file
  # (followed by the certificates above it) and a reference to its key. Both,
  # or neither. Every head that signs uses the same pair. See D62.
  signingCertificate: ""
  signingKey: ""

enrollment:
  # The most hours a node certificate is valid. A node renews at two thirds of
  # it, so it continues through a head outage of one third. There is no
  # revocation list: a node that cannot renew stops within this time.
  certificateLifetimeHours: 24
  # The role token this process enrolls with over a network. A reference, never
  # a value: `file:` or `env:`.
  roleToken: ""

cell:
  id: home
  region: home
  # A home installation has one controller and no quorum. A cell uses three or
  # five.
  controllers: 1

# ---------------------------------------------------------------------------
# The durable store
#
# Corndogs owns the queue and the payload. The collector holds no durable state
# of its own, so a collector restart loses nothing that it acknowledged.
# ---------------------------------------------------------------------------
corndogs:
  endpoint: 127.0.0.1:5080
  # An endpoint that is not loopback is reached over TLS (D62). In a pod the
  # endpoint is always a Service, so the collector uses TLS. The chart points
  # `caFile` at the authorities Secret, which signs the Corndogs certificate.
  # Leave both empty here; the chart sets them.
  tls:
    caFile: ""
    serverName: ""
  backend: file
  # One fsynced copy and no redundancy. Redundancy is an operator choice and is
  # not part of the word "durable".
  durableCopies: 1
  # `interval` and `never` acknowledge writes that a power loss can destroy, so
  # TallyOwl refuses to start against them.
  fsyncMode: group
  # A whole batch travels inside one task, so this must exceed the batch seal.
  maxPayloadBytes: 16MiB
  # How long a batch may keep being retried before it goes to quarantine. An
  # automatic retry must stop before the head forgets the batch ID, or a later
  # retry would be counted twice.
  maxDeliveryAge: 24h
  deliveryQueue: tallyowl-delivery
  quarantineQueue: tallyowl-quarantine
  # Nothing retries without this sweep. Retry, backoff, and dead-worker recovery
  # all stop when it stops, and readiness fails with it.
  sweepInterval: 1s
  # How many connections one process keeps to the durable store. The durable
  # store combines commits across connections. A quiet process opens one.
  connections: 8
  # How long one call to the durable store may take before the caller is told
  # that the durable store did not answer.
  callTimeout: 30s
  # How often the forwarder asks the durable store what each queue holds. The
  # durable store keeps the counts as records, so a count costs little.
  depthInterval: 2s

# ---------------------------------------------------------------------------
# The collector
# ---------------------------------------------------------------------------
collector:
  listen: 127.0.0.1:5100
  # Health and metrics only. This address serves nothing else.
  operationalListen: 127.0.0.1:5101
  # Intake, forwarder, and compatibility-receiver are independently deployable.
  # The home profile runs the first two in one process.
  roles:
    - intake
    - forwarder
  maxBatchBytes: 512KiB
  maxEventBytes: 64KiB
  maxProperties: 128
  # How long a collector holds a resolved key before it asks the head again.
  # This is how long a revocation takes to reach an application.
  keyCacheTtl: 30s
  # How long a collector may keep using a key answer it already had, when it
  # cannot reach the head. An outage extends what already worked; a credential
  # the collector never resolved still cannot start.
  keyCacheGrace: 60s
  # How often a collector fetches the collection policy from the head. This is
  # how long a policy change and a kill switch take to reach a collector, so
  # keep it short. A fetch with nothing new to send costs a few bytes.
  policyInterval: 30s
  # A secret is a reference, never a value. Write `file:/path` or `env:NAME`.
  # Make one with `tallyowl-head provision <project>`, which prints it once.
  apiKey: ""
  # The largest frame intake reads from an app driver. It must be at least
  # `maxBatchBytes`. A larger frame is refused before memory is used for it.
  maxFrameBytes: 4MiB
  # The most intake connections at one time. Each one uses a thread. `0` turns
  # the limit off.
  maxConnections: 1024
  # Close an intake connection that sends nothing for this long and has no
  # request in progress. An app driver reconnects on its next batch.
  idleTimeout: 5m
  # How long to wait for one answer from the head. Keep it shorter than the
  # 30 second claim the forwarder holds on a batch.
  headCallTimeout: 20s
  # How long a collector that was told to stop waits for work in progress.
  shutdownGrace: 10s

# ---------------------------------------------------------------------------
# Alert notifications
# ---------------------------------------------------------------------------
alerts:
  # The webhook hosts that may be at a loopback, private, or link-local address.
  # The head refuses such an address unless its host is here, because a webhook
  # address comes from a project administrator and the request leaves from the
  # head. A home installation that sends to a receiver on the same host lists
  # it, for example "127.0.0.1". "*" permits every address.
  allowedPrivateTargets: ""
  # How many notifications the head delivers at the same time.
  notificationWorkers: 4

# ---------------------------------------------------------------------------
# The head
# ---------------------------------------------------------------------------
head:
  # How long the head waits for the requests it already accepted when it is
  # told to stop. Keep it shorter than the time the host allows.
  shutdownGrace: 20s
  listen: 127.0.0.1:5110
  operationalListen: 127.0.0.1:5111
  # The address a collector forwarder reaches. An application never knows it.
  endpoint: 127.0.0.1:5110
  dataDir: ./data/head

# The head refuses an item whose workspace or project is not the one its
# source belongs to. It also refuses a batch whose source it has no record of,
# unless this is false.
ingest:
  requireKnownSource: true

# ---------------------------------------------------------------------------
# Tail sampling
#
# The head decides after a trace is complete, because one tablet already holds
# every span of one trace. A trace holding an error or a conversion, a trace
# with a failed span, and a slow trace are kept whatever the share says.
# ---------------------------------------------------------------------------
sampling:
  tail:
    enabled: false
    decisionWindow: 60s
    lateSpanGrace: 30s
    keepPercent: 100
    keepSlowerThan: 2s

# ---------------------------------------------------------------------------
# Storage
# ---------------------------------------------------------------------------
dashboard:
  # The dashboard carries the sign-in callback route and the same-origin
  # browser carrier. It never carries telemetry: the carrier refuses every
  # service but `TallyOwlControl`.
  enabled: true
  listen: 127.0.0.1:5120
  # The dashboard serves plaintext. On an address that is not loopback, put it
  # behind a gateway that ends TLS and set this to true. D62.
  allowPlaintext: false
  # `./tools.sh build` writes the bundle here.
  assets: packages/dashboard/dist
  # The path part of `linkkeys.callbackUrl`. A sign-in returns here.
  callbackPath: /sign-in/callback
  # A starter campaign dashboard, written once for each project the first time
  # the head sees it. An operator who removes it does not get it back.
  starterDashboard: true
  # The conversion goal it asks about. A goal is the application's own word.
  starterConversionGoal: purchase

storage:
  # How long the head remembers a batch ID, so a repeated batch stays one
  # logical commit. D36 pairs this with `corndogs.maxDeliveryAge`: it must be
  # longer, or an automatic retry can outlive the head's memory and commit the
  # batch a second time. TallyOwl refuses a configuration where it is not.
  deduplicationWindow: 72h
  # `local-one` is legal only for a tablet with one voter, which is what a home
  # installation has. TallyOwl refuses the combination rather than quietly
  # changing the policy.
  receiptPolicy: local-one
  tabletVoters: 1
  coldTier:
    enabled: false
  reserveBytes: 1GiB

# ---------------------------------------------------------------------------
# Integrity and recovery
# ---------------------------------------------------------------------------
integrity:
  # Catches damage in data a query touches, when it touches it. The cost is a
  # checksum over bytes already in memory. `none` is a legitimate choice and the
  # dashboard shows it.
  mode: verify-on-read
  scrub:
    period: 7d
    rateLimit: 16MiB

catalog:
  snapshots:
    # Off. The default recovery for a lost catalog is a restore from the
    # ordinary backup.
    enabled: false
    period: 1h
    keep: 2

compaction:
  # How old a segment must be before compaction consolidates its time bucket,
  # grouped by the end-user value, so one person's cold rows sit in few
  # segments. Zero disables the pass. See HIGH_CARDINALITY.md.
  coldGroupAfter: 48h
  # The most stored source bytes one consolidation pass rewrites. The rows of
  # a pass are held decompressed in memory, many times their stored size, so
  # this bounds the memory of the pass; a large backlog converges over passes.
  coldGroupBatch: 32MiB
  # The size cold consolidation aims each rewritten segment at. A hit
  # decompresses every candidate segment whole, so this is also the price of
  # a cold exact lookup. See BENCHMARKS.md section 24.1.
  coldGroupTarget: 2MiB
  # Must outlast the longest query, or compaction can remove data that a running
  # query still reads.
  gcGrace: 1h

# ---------------------------------------------------------------------------
# Metric series cost
#
# TallyOwl supports high-cardinality metric series. When a budget is full it
# refuses a new series in the open with `resource-exhausted` and names the
# metric. It never folds a series into an overflow series and never drops a
# point quietly. See D12 and DATA_MODEL.md section 3.4.
# ---------------------------------------------------------------------------
metrics:
  # The head derives request, error, and duration series for each service
  # operation from the spans it commits, at this resolution.
  goldenSignalResolution: 60s
  # A downsample pass rolls delta points up to this resolution. DATA_MODEL.md
  # section 6 names one minute, then hourly.
  downsampleResolution: 1h
  # A closed window waits this long before the pass rolls it up, so a point
  # that arrives a little late is in the rollup.
  downsampleLatenessGrace: 5m
  maxSeriesForEachMetric: 100000
  # Metric names one project may hold in one collector. Keep a metric name
  # fixed, and put a value that changes in a label.
  maxMetricNamesForEachProject: 10000
  maxBytesForEachMetric: 64MiB
  maxLabels: 32
  maxLabelValueBytes: 1024
  maxLabelBytes: 4096
  # How many points in one batch the collector merges. Past this the batch
  # travels unmerged, which costs bytes and never costs correctness.
  maxMergePoints: 10000
  idleSeriesExpiry: 1h
  selfObservation:
    # Off. Self-metrics cost ingest capacity that an installation may want for
    # its own data.
    enabled: false
    # The collector the head sends its own instruments to, as `host:port`. A
    # DNS name is accepted: the head dials this address and does not bind it.
    # Empty uses `collector.listen`, which is right on one host.
    endpoint: ""
    period: 60s

# ---------------------------------------------------------------------------
# Retention classes
#
# A telemetry kind maps to a class. `rollup` must be at least as long as
# `detailed`, because a rollup that expires first leaves a gap no query can
# fill. See POLICY.md section 4 and D43.
# ---------------------------------------------------------------------------
retention:
  # Accepted interchange CBOR. None by default; an ordinary query never needs it.
  raw: 0s
  detailed: 30d
  rollup: 395d
  audit: 2555d

# ---------------------------------------------------------------------------
# This node's identity for placement
#
# A home installation has one node and needs neither of these. A cell puts at
# most one voter of a tablet in each failure domain, so one rack's loss never
# ends a quorum.
# ---------------------------------------------------------------------------
node:
  # Empty means the head assigns a name at enrollment, which is the ordinary
  # case. Set it only when a node has to keep its name across a rebuild.
  name: ""
  failureDomain: default

# ---------------------------------------------------------------------------
# Placement
#
# The controller decides in every mode; the mode selects whether it acts. The
# first releases use recommendation-only until tests prove safe automatic
# control. See CELLS.md section 6.
# ---------------------------------------------------------------------------
placement:
  mode: recommendation-only
  # A cell that started every change it wanted at once would move more data than
  # it could carry.
  concurrentChanges: 1
  splitAbove: 64GiB
  # Far below half of `splitAbove` on purpose. Exactly half would let a tablet
  # split and merge repeatedly around one size.
  mergeBelow: 8GiB
  slowNode:
    # Automatic demotion during a network-wide slowdown cascades, so a slow node
    # raises an alert and names a cause instead.
    action: alert
    factor: 4
    duration: 5m

# ---------------------------------------------------------------------------
# Replication
#
# Node-to-node only: consensus messages, snapshot chunks, segment copies, and
# partial aggregates. An application never reaches this address and a browser
# never reaches it. A home installation has one node and leaves it empty.
# ---------------------------------------------------------------------------
replication:
  listen: ""
  # The address other storage nodes dial to reach this one. Empty means
  # `listen`. A pod listens on every interface, and a peer cannot dial 0.0.0.0.
  advertise: ""
  # A cell normally learns its peers from its controller quorum. This is what a
  # first bootstrap uses.
  peers: ""
  # Longer than an election, so an ordinary leader change costs a retry rather
  # than a refusal.
  writeTimeout: 10s
  # What bounds a tablet's consensus log on disk. A tablet snapshot seals, and a
  # seal makes a segment, so a smaller number here means more small segments.
  snapshotEvery: 4096
  keepAfterSnapshot: 512
  # The memory one consensus group's log file may use as a cache. A node holds
  # one file for each tablet it has.
  logCacheBytes: 16MiB

query:
  maxRuntime: 30s
  # How deeply a query may nest expressions. A deeper tree is refused before it
  # is evaluated.
  # How long a materialised identity graph is used before it is built again.
  # Zero rebuilds it for every question.
  # How many alert evaluations may run at once. Alerting cannot occupy more of
  # the query path than this.
  alertConcurrency: 1
  identityRefresh: 5m
  maxExpressionDepth: 16
  # How many queries one project may run at the same time. One more is
  # refused at once with `resource-exhausted`.
  maxConcurrentForEachProject: 8
  # A query that needs more tablets than this is refused with a typed error that
  # names both numbers, rather than opening a connection to every tablet.
  maxFanOut: 256

# ---------------------------------------------------------------------------
# Compatibility receivers
#
# A compatibility receiver never listens by default. An operator enables it. A
# port never appears because the binary contains the feature.
# ---------------------------------------------------------------------------
compatibility:
  openTelemetry:
    enabled: false
    # 4318 is the OpenTelemetry Protocol over HTTP port. An exporter reaches it
    # with OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf.
    listen: 127.0.0.1:4318
  # Scraping is outbound and there is no default target.
  prometheus:
    # Write each target as http://host:port/metrics. A target with https is
    # refused, because this build scrapes over HTTP only.
    targets: []
    interval: 60s
    # The limit for one full scrape, from the connection to the last byte.
    timeout: 5s
    # A response larger than this fails the scrape, and nothing from it is kept.
    maxBodyBytes: 16MiB
    # How many targets the collector reads at one time.
    workers: 8

# ---------------------------------------------------------------------------
# Sign-in
#
# LinkKeys owns human authentication and TallyOwl owns the session that follows.
# With no trusted domains there is nothing to accept, so this is off; an
# operator issues a session with `tallyowl-head session create` instead.
# ---------------------------------------------------------------------------
# D62: a CSIL connection that crosses a network uses TLS. A loopback or
# `unix:` address needs none of this.
tls:
  # Directories for collector intake and the OpenTelemetry receiver. Each holds
  # `tls.crt` (the chain, leaf first) and `tls.key`. Two directories let a
  # certificate be replaced before it expires, with no outage.
  certificateDirectories: []
  # How often certificate files and trusted authorities are read again.
  reloadInterval: 30s

transport:
  # Serve and dial CSIL in plaintext on a network address. Use this only on a
  # network that something else protects. The service logs each exposed
  # listener.
  allowPlaintext: false

linkkeys:
  enabled: false
  trustedDomains: ""
  callbackUrl: http://127.0.0.1:5120/sign-in/callback
  appName: TallyOwl
  sessionLifetime: 24h

log:
  # An end-user ID appears at debug only, and a project policy can forbid even
  # that. No secret and no personal data appears at any level.
  level: info
