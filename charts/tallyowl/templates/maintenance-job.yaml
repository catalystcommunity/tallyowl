{{- include "tallyowl.validate" . -}}
{{- if .Values.deployment.maintenance.enabled }}
# One administration verb against the data volume of one pod.
#
# A verb that changes the store opens the data directory, and a running head
# holds the lock on it. So while this Job is enabled the StatefulSet renders
# with no replicas. The Job tries again while the head pod stops.
#
# The name carries a hash of the arguments, because a Job cannot be changed
# after it is made and the next verb needs a new one.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "tallyowl.fullname" . }}-maintenance-{{ list .Values.deployment.maintenance.command .Values.deployment.maintenance.args | toJson | sha256sum | trunc 8 }}
  labels:
    {{- include "tallyowl.labels" . | nindent 4 }}
    tallyowl.io/component: maintenance
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        tallyowl.io/component: maintenance
    spec:
      restartPolicy: Never
      # Kubernetes puts a variable in the pod for each Service in the
      # namespace, named after the Service: `TALLYOWL_PORT`,
      # `TALLYOWL_CORNDOGS_SERVICE_HOST`, and so on. The loader reads every
      # `TALLYOWL_*` variable as a setting, so each start warned about two
      # dozen settings that do not exist. TallyOwl finds its peers through
      # configuration, not through these variables.
      enableServiceLinks: false
      {{- with .Values.securityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: maintenance
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- if .Values.deployment.maintenance.command }}
            {{- range .Values.deployment.maintenance.command }}
            - {{ . | quote }}
            {{- end }}
            {{- else }}
            - tallyowl-head
            - --config
            - /etc/tallyowl/tallyowl.yaml
            {{- range .Values.deployment.maintenance.args }}
            - {{ . | quote }}
            {{- end }}
            {{- end }}
          workingDir: /var/lib/tallyowl
          {{- with .Values.deployment.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/tallyowl
              readOnly: true
            - name: data
              mountPath: /var/lib/tallyowl/data
            {{- include "tallyowl.securityMounts" . | nindent 12 }}
            {{- if .Values.deployment.maintenance.backupClaim }}
            - name: backup
              mountPath: {{ .Values.deployment.maintenance.backupMountPath }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "tallyowl.fullname" . }}
        - name: data
          persistentVolumeClaim:
            claimName: data-{{ include "tallyowl.fullname" . }}-{{ .Values.deployment.maintenance.ordinal }}
        {{- include "tallyowl.securityVolumes" . | nindent 8 }}
        {{- if .Values.deployment.maintenance.backupClaim }}
        - name: backup
          persistentVolumeClaim:
            claimName: {{ .Values.deployment.maintenance.backupClaim }}
        {{- end }}
{{- end }}
