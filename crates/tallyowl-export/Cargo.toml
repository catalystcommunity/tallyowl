[package]
name = "tallyowl-export"
description = "Parquet export. A separate crate, so the always-on path never links Arrow or Parquet."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tallyowl-store = { workspace = true }
tallyowl-obs = { workspace = true }

# AGENTS.md: "Arrow and Parquet are optional export dependencies, not
# dependencies of the always-on collector, storage, query, or dashboard path."
# They live here and nowhere else, so a minimal build never loads them.
parquet = { version = "56", default-features = false, features = ["arrow", "zstd"] }
arrow-array = "56"
arrow-schema = "56"
