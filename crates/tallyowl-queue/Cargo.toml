[package]
name = "tallyowl-queue"
description = "The durable task boundary: the seam every TallyOwl component uses to reach Corndogs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tallyowl_queue"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
tallyowl-obs = { workspace = true }
corndogs = { workspace = true }

[dev-dependencies]
# The TLS test stands up a durable store that speaks Corndogs' wire protocol
# over TLS. That protocol is CSIL-RPC, which `tallyowl-rpc` serves.
tallyowl-rpc = { workspace = true }
rcgen = { workspace = true }
